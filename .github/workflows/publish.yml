# Publishes the folders under ontologies/ that a push to main changed, through
# the hub. The run only starts a hub job per folder and does not wait for them, so it
# fails only when the hub turns a request down. The hub reads the folders from GitHub
# at the pushed commit.
#
# Run by hand, it publishes the folders given.
#
# Needs repository variable HUB_URL and secret HUB_PASSWORD.
name: Publish

on:
  push:
    branches: [main]
    paths:
      - ontologies/**
  workflow_dispatch:
    inputs:
      folders:
        description: Folders under ontologies/ to publish, as namespace/name/version, separated by spaces
        required: true

permissions:
  contents: read

# One run at a time, and never cancel one halfway, before it has started all its jobs.
# Runs are queued, order does not matter.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # A run by hand can pick any branch, and only main may be published
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HUB_URL: ${{ vars.HUB_URL }}
      HUB_USER: ${{ vars.HUB_USER }}
      HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # to diff against the commit before the push
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish changed folders
        if: github.event_name == 'push'
        run: python scripts/index.py --ref "$GITHUB_SHA" --changed "$BEFORE"
        env:
          BEFORE: ${{ github.event.before }}
      - name: Publish chosen folders
        if: github.event_name == 'workflow_dispatch'
        # Through env, not ${{ }} in the script, so the input cannot inject shell
        run: |
          set -f
          python scripts/index.py --ref "$GITHUB_SHA" $FOLDERS
        env:
          FOLDERS: ${{ inputs.folders }}
