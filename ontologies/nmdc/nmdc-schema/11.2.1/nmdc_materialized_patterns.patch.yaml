# JSON Patch (RFC 6902) the hub applies to nmdc_materialized_patterns.yaml before publishing it.
# README.md says what each change is for.
- op: add
  path: /prefixes/GENEPIO
  value:
    prefix_prefix: GENEPIO
    prefix_reference: http://purl.obolibrary.org/obo/GENEPIO_
- op: add
  path: /prefixes/MIxS
  value:
    prefix_prefix: MIxS
    prefix_reference: https://w3id.org/mixs/
- op: add
  path: /prefixes/OMIT
  value:
    prefix_prefix: OMIT
    prefix_reference: http://purl.obolibrary.org/obo/OMIT_
- op: add
  path: /prefixes/edam.format
  value:
    prefix_prefix: edam.format
    prefix_reference: http://edamontology.org/format_
- op: remove
  path: /enums/wall_texture_enum/permissible_values/
- op: replace
  path: /enums/InstrumentModelEnum/permissible_values/novaseq_6000/structured_aliases
  value:
  - literal_form: Illumina NovaSeq S2
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
  - literal_form: Illumina NovaSeq S4
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
  - literal_form: Illumina NovaSeq SP
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
- op: replace
  path: /enums/InstrumentModelEnum/permissible_values/hiseq_2500/structured_aliases
  value:
  - literal_form: Illumina HiSeq 2500-1TB
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
  - literal_form: Illumina HiSeq 2500-Rapid
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
- op: replace
  path: /enums/InstrumentModelEnum/permissible_values/nextseq/structured_aliases
  value:
  - literal_form: Illumina NextSeq-HO
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
  - literal_form: Illumina NextSeq-MO
    predicate: NARROW_SYNONYM
    contexts:
    - https://gold.jgi.doe.gov/
- op: add
  path: /slots/EMSL
  value:
    name: EMSL
    description: Group of terms that appear in the 'EMSL' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/JGI-Metagenomics
  value:
    name: JGI-Metagenomics
    description: Group of terms that appear in the 'JGI-Metagenomics' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/JGI-Metatranscriptomics
  value:
    name: JGI-Metatranscriptomics
    description: Group of terms that appear in the 'JGI-Metatranscriptomics' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/MIxS Inspired
  value:
    name: MIxS Inspired
    description: Group of terms that appear in the 'MIxS Inspired' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/Sample ID
  value:
    name: Sample ID
    description: Group of terms that appear in the 'Sample ID' section of the NMDC sample metadata submission portal
    abstract: true
