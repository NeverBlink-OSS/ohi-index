- op: add
  path: /slots/JGI-Metatranscriptomics
  value:
    name: JGI-Metatranscriptomics
    description: Group of terms that appear in the 'JGI-Metatranscriptomics' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/MIxS Inspired
  value:
    name: MIxS Inspired
    description: Group of terms that appear in the 'MIxS Inspired' section of the NMDC sample metadata submission portal
    abstract: true
- op: add
  path: /slots/Sample ID
  value:
    name: Sample ID
    description: Group of terms that appear in the 'Sample ID' section of the NMDC sample metadata submission portal
    abstract: true
