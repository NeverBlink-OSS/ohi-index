# JSON Patch (RFC 6902) the hub applies to nmdc_materialized_patterns.yaml before publishing it.
# README.md says what each change is for.
- op: add
  path: /prefixes/OM
  value:
    prefix_prefix: OM
    prefix_reference: http://www.ontology-of-units-of-measure.org/resource/om-2/
- op: add
  path: /prefixes/orcid
  value:
    prefix_prefix: orcid
    prefix_reference: https://orcid.org/
- op: remove
  path: /enums/UnitEnum/permissible_values/%
- op: add
  path: /enums/UnitEnum/permissible_values/PERCENT
  value:
    text: PERCENT
    alias: '%'
    description: The Unified Code for Units of Measure (UCUM) representation of percent.
    aliases:
    - percent
    - Percent
- op: remove
  path: /enums/wall_texture_enum/permissible_values/
- op: replace
  path: /enums/InstrumentModelEnum/permissible_values/novaseq_6000/structured_aliases
