# Package of the tss: vocabulary for the ohi index (https://ohi.dev).
# To release: bump dcterms:modified in tss.ttl, set version and the tag in the tss.ttl URL to that date,
# update sha256 (shasum -a 256 tss.ttl) and size (wc -c < tss.ttl), commit, tag the commit with the date,
# and copy this file to ontologies/rsp/tss/<version>/ohi-package.yaml in a PR to NeverBlink-OSS/ohi-index.
namespace: rsp
name: tss
version: "2026-11-21"
language: owl
syntax: turtle
roots: [tss.ttl]
licenses: ["CC-BY-4.0"]
licenseFiles: [legalcode.txt]
dependencies: []
title: "RDF Time Series Sources"
authors:
  - name: "Pieter Colpaert"
    link: "https://pietercolpaert.be"
  - name: "Shehab Abdelfatah"
    link: "https://www.linkedin.com/in/shehabeldeen-abdelfatah-289123365/"
publishers:
  - name: "W3C RDF Stream Processing Community Group"
    link: "https://www.w3.org/community/rsp/"
description: "Vocabulary for describing time series sources in RDF: a source, its fields and how to read their values, the summaries of those values, and the points of a source whose readings are embedded in its metadata."
keywords: ["time series", "streams", "IoT", "sensors"]
originalSources: ["https://github.com/KNowledgeOnWebScale/rdf-tss", "https://knowledgeonwebscale.github.io/rdf-tss/"]
sources:
  - url: https://cdn.jsdelivr.net/gh/KNowledgeOnWebScale/rdf-tss@2026-11-21/tss.ttl
    sha256: "df200090c259a426d61dc07eaa2fe6d85ad09a8211b0d9165d33a57e3057f5d9"
    size: 34675
  - url: https://creativecommons.org/licenses/by/4.0/legalcode.txt
    sha256: "9ba9550ad48438d0836ddab3da480b3b69ffa0aac7b7878b5a0039e7ab429411"
    size: 18657
